<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fitness Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <style>
        :root { --accent: #6ee7b7; }
        body { background-color: #0f0f0f; color: #e5e7eb; }

        .module-card {
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }
        .module-card:hover {
            border-color: var(--accent) !important;
            background-color: rgba(110,231,183,0.06) !important;
        }
        .module-card.active {
            border-color: var(--accent) !important;
            background-color: rgba(110,231,183,0.10) !important;
        }

        .fi {
            display: block;
            width: 100%;
            background: #1f1f1f;
            color: #e5e7eb;
            border: 1px solid #333;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-family: inherit;
            transition: border-color 0.15s;
        }
        .fi:focus { outline: none; border-color: var(--accent); }
        .fi::placeholder { color: #4b5563; }
        .fi option { background: #1f1f1f; }

        /* Markdown */
        .md h1 { font-size:1.3rem; font-weight:700; color:var(--accent); margin:1.5rem 0 0.5rem; }
        .md h2 { font-size:1.1rem; font-weight:700; color:var(--accent); margin:1.25rem 0 0.4rem; }
        .md h3 { font-size:1rem;  font-weight:600; color:#a7f3d0; margin:1rem 0 0.3rem; }
        .md h4 { font-size:.9rem; font-weight:600; color:#d1fae5; margin:.75rem 0 .25rem; }
        .md p  { margin-bottom:.7rem; line-height:1.75; }
        .md ul { margin:.3rem 0 .7rem 1.25rem; }
        .md ol { margin:.3rem 0 .7rem 1.25rem; }
        .md li { margin-bottom:.3rem; line-height:1.65; }
        .md ul li { list-style-type:disc; }
        .md ol li { list-style-type:decimal; }
        .md strong { color:#f9fafb; font-weight:700; }
        .md em     { color:#d1d5db; }
        .md code   { background:#1a2a1a; color:var(--accent); padding:.1em .35em; border-radius:4px; font-size:.82rem; }
        .md pre    { background:#111; border:1px solid #2a2a2a; border-radius:.5rem; padding:1rem; overflow-x:auto; margin-bottom:.75rem; }
        .md pre code { background:none; padding:0; }
        .md hr     { border-color:#2a2a2a; margin:1.25rem 0; }
        .md blockquote { border-left:3px solid var(--accent); padding-left:1rem; color:#9ca3af; margin:.75rem 0; }
        .md table  { width:100%; border-collapse:collapse; margin-bottom:.75rem; font-size:.85rem; }
        .md th     { background:#1a2a1a; color:var(--accent); padding:.5rem .75rem; text-align:left; border:1px solid #2a3a2a; }
        .md td     { padding:.45rem .75rem; border:1px solid #2a2a2a; color:#d1d5db; }
        .md tr:nth-child(even) td { background:#161616; }

        .typing::after { content:'▋'; color:var(--accent); animation:blink .8s step-end infinite; }
        @keyframes blink { 50% { opacity:0; } }

        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:#111; }
        ::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:#444; }
    </style>
</head>
<body class="min-h-screen">
<div class="max-w-4xl mx-auto px-4 py-10">

    <!-- Header -->
    <header class="text-center mb-12">
        <h1 class="text-4xl font-black mb-2" style="color:#6ee7b7;">⚡ AI Fitness Coach</h1>
        <p class="text-gray-600 text-sm">7-Module Precision Coaching System · Powered by Claude</p>
    </header>

    <!-- API Key -->
    <section class="mb-10 p-5 rounded-2xl border border-gray-800" style="background:#141414;">
        <label class="block text-[11px] font-semibold uppercase tracking-widest text-gray-600 mb-2">Anthropic API Key</label>
        <div class="flex gap-2">
            <input type="password" id="apiKey" class="fi flex-1" placeholder="sk-ant-api03-..." autocomplete="off" spellcheck="false">
            <button onclick="toggleKey()" id="keyToggle"
                class="px-4 py-2 rounded-lg border border-gray-700 text-gray-500 hover:text-gray-300 hover:border-gray-600 text-xs transition-colors whitespace-nowrap">
                Show
            </button>
        </div>
        <p class="text-[11px] text-gray-700 mt-2">🔒 Memory only — never saved to disk or sent anywhere except api.anthropic.com</p>
    </section>

    <!-- Module Grid -->
    <section class="mb-10">
        <h2 class="text-[11px] font-semibold uppercase tracking-widest text-gray-600 mb-5">Select Coaching Module</h2>
        <div id="moduleGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </section>

    <!-- Form -->
    <section id="formSection" class="hidden mb-8 p-6 rounded-2xl border border-gray-800" style="background:#141414;">
        <div class="mb-6 pb-4 border-b border-gray-800">
            <h3 class="text-xl font-bold" id="formTitle"></h3>
            <p class="text-xs text-gray-600 mt-1" id="formRole"></p>
        </div>
        <div id="formFields"></div>
        <button id="genBtn" onclick="generate()"
            class="mt-6 w-full py-4 rounded-xl font-bold text-sm tracking-wide transition-all hover:opacity-90 active:scale-[0.99]"
            style="background:linear-gradient(135deg,#6ee7b7 0%,#34d399 50%,#10b981 100%);color:#052e16;">
            ⚡ Generate My Plan
        </button>
    </section>

    <!-- Output -->
    <section id="outputSection" class="hidden p-6 rounded-2xl border border-gray-800" style="background:#141414;">
        <div class="flex items-center justify-between mb-5 pb-4 border-b border-gray-800">
            <div class="flex items-center gap-3">
                <div id="statusDot" class="w-2 h-2 rounded-full" style="background:#6ee7b7;"></div>
                <span class="text-sm font-semibold" style="color:#6ee7b7;" id="outputLabel">Your Plan</span>
            </div>
            <button onclick="clearOutput()"
                class="text-xs text-gray-600 hover:text-gray-400 px-3 py-1.5 rounded-lg border border-gray-800 hover:border-gray-700 transition-colors">
                Clear
            </button>
        </div>
        <div id="output" class="md text-sm text-gray-300 leading-relaxed"></div>
    </section>

    <footer class="text-center mt-16 text-xs text-gray-800">
        AI Fitness Coach · Plans are AI-generated suggestions, not medical advice
    </footer>
</div>

<script>
const MODULES = [
  {
    id: 1, icon: "🏋️", title: "Workout Routine Architect", badge: "Training",
    system: `You are an Elite Strength and Conditioning Coach with 20+ years designing programs for competitive physique and strength athletes.`,
    goal: `Design a high-yield 4-day workout split. No junk volume — every set must have a clear stimulus purpose. Provide: (1) full 4-day split with exercise names, sets, rep ranges, and target RPE/RIR, (2) brief technique notes for key movements, (3) a 4-week linear progression scheme with load increments, (4) notes on modifications or substitutions based on the injury history provided.`,
    fields: [
      { id:"height",   label:"Height",                  type:"text",     ph:"e.g. 5'10\" or 178 cm" },
      { id:"weight",   label:"Weight",                  type:"text",     ph:"e.g. 185 lbs or 84 kg" },
      { id:"injuries", label:"Injury History",          type:"textarea", ph:"e.g. left knee tendinitis (2023), no shoulder issues — or \"None\"" },
      { id:"strength", label:"Current Strength Levels", type:"textarea", ph:"e.g. Squat: 225×5, Bench: 175×5, Deadlift: 275×5, OHP: 115×5" }
    ]
  },
  {
    id: 2, icon: "🥗", title: "Macro Engine", badge: "Nutrition",
    system: `You are a Performance Dietitian specializing in body recomposition with 15+ years working with physique athletes and high-performance clients.`,
    goal: `Calculate exact daily nutrition targets. Provide: (1) lean body mass and TDEE estimate with activity multiplier, (2) daily calorie target with clear rationale, (3) protein/carb/fat targets in grams, (4) training day vs. rest day macro adjustments if relevant to the goal, (5) 2 sample day meal structures hitting the targets using whole foods.`,
    fields: [
      { id:"height", label:"Height",               type:"text",   ph:"e.g. 5'10\" or 178 cm" },
      { id:"weight", label:"Weight",               type:"text",   ph:"e.g. 185 lbs or 84 kg" },
      { id:"bf",     label:"Estimated Body Fat %", type:"text",   ph:"e.g. 18% (rough estimate is fine)" },
      { id:"goal",   label:"Primary Goal",         type:"select", opts:["Lean Bulk","Aggressive Cut","Body Recomp"] }
    ]
  },
  {
    id: 3, icon: "🔍", title: "Form Correction Auditor", badge: "Technique",
    system: `You are a Kinesiology and Movement Expert specializing in biomechanics, motor patterns, and neuromuscular activation. You identify compensation patterns that divert stimulus away from target muscles.`,
    goal: `Diagnose the described technique. Provide: (1) the most likely mechanical flaw based on the setup described, (2) the anatomical reason tension is going to the wrong place, (3) exactly 3 numbered mind-muscle cues that address the root cause directly, (4) one corrective drill or warm-up movement to reinforce the fix.`,
    fields: [
      { id:"lift",    label:"Lift Name",                           type:"text",     ph:"e.g. Squat, Romanian Deadlift, Bench Press, Pull-Up" },
      { id:"setup",   label:"How You Set Up and Execute the Lift",  type:"textarea", ph:"Describe: stance/grip width, bar position, breathing/bracing, how you initiate and execute the movement..." },
      { id:"tension", label:"Where You Feel Tension",              type:"textarea", ph:"e.g. Feel RDLs mostly in lower back, not hamstrings. Bench felt in front delts, not chest." }
    ]
  },
  {
    id: 4, icon: "⏱️", title: "Peri-Workout Scheduler", badge: "Timing",
    system: `You are a Sports Nutritionist specializing in peri-workout nutrition and nutrient timing for physique and strength athletes.`,
    goal: `Design a peri-workout meal protocol using whole foods only. Provide: (1) pre-workout meal 60–90 min before — exact foods, portion sizes, macro breakdown, (2) optional intra-workout strategy if session exceeds 75 min, (3) post-workout meal within 60 min — exact foods, portion sizes, macro breakdown, (4) rationale for each timing window linked to glycogen, MPS, and insulin sensitivity, (5) early morning training adjustments if applicable.`,
    fields: [
      { id:"time",   label:"Training Time of Day", type:"text",   ph:"e.g. 6:00 AM, 12:30 PM, 7:00 PM" },
      { id:"weight", label:"Body Weight",          type:"text",   ph:"e.g. 185 lbs or 84 kg" },
      { id:"goal",   label:"Primary Goal",         type:"select", opts:["Muscle Gain","Fat Loss","Performance / Maintenance"] }
    ]
  },
  {
    id: 5, icon: "😴", title: "Recovery & Sleep Diagnostic", badge: "Recovery",
    system: `You are a Sports Endocrinologist and Sleep Specialist with expertise in hormonal optimization, HRV-based recovery, and autonomic nervous system regulation in athletes.`,
    goal: `Provide a 48-hour Metabolic Flushing SOP. Cover: (1) root cause diagnosis — what physiological state is most likely driving these symptoms, (2) hydration and electrolyte protocol with specific quantities and timing, (3) nervous system down-regulation strategy, (4) sleep optimization protocol for the next 2 nights, (5) training load recommendation for the next 48 hours, (6) the single most impactful nutritional intervention with physiological rationale.`,
    fields: [
      { id:"sleep",  label:"Average Daily Sleep Hours",   type:"text",     ph:"e.g. 5.5 hours" },
      { id:"stress", label:"Current Stress Level",        type:"select",   opts:["Low","Moderate","High","Extreme"] },
      { id:"freq",   label:"Training Frequency Per Week", type:"text",     ph:"e.g. 5 days — heavy compound work" },
      { id:"symp",   label:"Symptoms Noticed",            type:"textarea", ph:"e.g. water retention, difficulty falling asleep, afternoon energy crash, poor gym performance, irritability" }
    ]
  },
  {
    id: 6, icon: "📊", title: "Performance Auditor", badge: "Analytics",
    system: `You are a Data-Driven Physique Coach specializing in training log analysis to identify adaptation vs. fatigue accumulation and optimize volume landmarks for long-term progressive overload.`,
    goal: `Audit the 3-week log. Provide: (1) verdict — adaptation trend or fatigue accumulation, citing specific data points, (2) volume assessment per muscle group relative to MRV based on performance trends, (3) specific exercises showing stagnation or overreaching, (4) exactly 3 numbered adjustments to volume/intensity/rest to restore the strength floor and restart adaptation, (5) deload recommendation if warranted with specific parameters.`,
    fields: [
      { id:"logs", label:"Training Logs — Last 3 Weeks", type:"textarea", ph:"Paste your logs:\n\nWeek 1 – Day 1:\nSquat: 225×5, 225×5, 225×5 (2 RIR)\nBench: 175×5, 175×5 (1 RIR)\n\nWeek 2 – Day 1:\nSquat: 230×5, 230×4, 230×3 (0 RIR)\n...\n\nInclude: exercise, weight, sets×reps, RIR or reps left in tank" }
    ]
  },
  {
    id: 7, icon: "🎯", title: "Transformation Calibration", badge: "Diagnostics",
    system: `You are an Elite Transformation Consultant who has coached hundreds of athletes through physique competitions, aggressive cuts, and lean bulks. You specialize in diagnosing why transformations stall and engineering precise corrections.`,
    goal: `Diagnose what is broken based on the metric combinations. Provide: (1) the most likely root cause — be specific about the mechanism (adaptive thermogenesis, water masking, hormonal suppression, caloric estimation error, training fatigue, etc.), (2) how to confirm or rule out this diagnosis within 48 hours, (3) exactly 3 numbered mechanical adjustments ranked by impact — each with a specific action, magnitude of change, and physiological rationale, (4) a 2-week checkpoint: what specific metrics should shift if the diagnosis is correct.`,
    fields: [
      { id:"wt",      label:"Body Weight Trend (Last 2 Weeks)", type:"select",   opts:["Dropping steadily","Holding / Completely Stalled","Slowly Rising","Fluctuating unpredictably"] },
      { id:"waist",   label:"Waist Measurement Trend",          type:"select",   opts:["Decreasing","Holding / No change","Increasing"] },
      { id:"str",     label:"Strength Trend",                   type:"select",   opts:["Increasing","Maintaining","Slowly Declining","Significantly Declining"] },
      { id:"phase",   label:"Current Phase",                    type:"select",   opts:["Lean Bulk","Aggressive Cut","Recomp","Maintenance"] },
      { id:"context", label:"Additional Context (Optional)",    type:"textarea", ph:"e.g. 10 weeks into cut, recently added cardio, sleep poor, calories at 1,800/day..." }
    ]
  }
];

let activeModule = null, accumulated = '', streaming = false;

(function init() {
  const grid = document.getElementById('moduleGrid');
  MODULES.forEach(m => {
    const card = document.createElement('div');
    card.className = 'module-card p-4 rounded-xl border border-gray-800';
    card.style.background = '#181818';
    card.id = `card-${m.id}`;
    card.innerHTML = `<div class="text-2xl mb-2">${m.icon}</div><div class="text-[11px] font-semibold uppercase tracking-wider mb-1" style="color:#6ee7b7;">${m.badge}</div><div class="text-sm font-semibold text-gray-200">${m.title}</div>`;
    card.addEventListener('click', () => selectModule(m.id));
    grid.appendChild(card);
  });
})();

function selectModule(id) {
  activeModule = MODULES.find(m => m.id === id);
  if (!activeModule) return;
  MODULES.forEach(m => document.getElementById(`card-${m.id}`)?.classList.remove('active'));
  document.getElementById(`card-${id}`)?.classList.add('active');
  document.getElementById('formTitle').textContent = `${activeModule.icon} ${activeModule.title}`;
  document.getElementById('formRole').textContent   = activeModule.system.split('.')[0] + '.';
  const container = document.getElementById('formFields');
  container.innerHTML = '';
  activeModule.fields.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'mb-5';
    const label = document.createElement('label');
    label.className = 'block text-[11px] font-semibold uppercase tracking-widest text-gray-500 mb-2';
    label.textContent = f.label;
    label.htmlFor = `f-${f.id}`;
    wrap.appendChild(label);
    wrap.appendChild(buildField(f));
    container.appendChild(wrap);
  });
  const sec = document.getElementById('formSection');
  sec.classList.remove('hidden');
  setTimeout(() => sec.scrollIntoView({ behavior:'smooth', block:'start' }), 80);
}

function buildField(f) {
  let el;
  if (f.type === 'textarea') {
    el = document.createElement('textarea');
    el.rows = f.id === 'logs' ? 10 : 3;
    el.placeholder = f.ph || '';
    el.style.resize = 'vertical';
  } else if (f.type === 'select') {
    el = document.createElement('select');
    const def = document.createElement('option');
    def.value = ''; def.textContent = '— Select —'; def.disabled = true; def.selected = true;
    el.appendChild(def);
    f.opts.forEach(o => { const opt = document.createElement('option'); opt.value = o; opt.textContent = o; el.appendChild(opt); });
  } else {
    el = document.createElement('input'); el.type = 'text'; el.placeholder = f.ph || ''; el.autocomplete = 'off';
  }
  el.id = `f-${f.id}`; el.className = 'fi'; return el;
}

async function generate() {
  if (streaming) return;
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('Enter your Anthropic API key at the top.'); return; }
  if (!activeModule) { alert('Select a module first.'); return; }
  const inputs = {}; let hasAny = false;
  activeModule.fields.forEach(f => { const v = document.getElementById(`f-${f.id}`)?.value?.trim() ?? ''; inputs[f.label] = v; if (v) hasAny = true; });
  if (!hasAny) { alert('Fill in at least one field before generating.'); return; }
  const system = `${activeModule.system}\n\n## Your Task\n${activeModule.goal}\n\n## Response Format\n- Use ## and ### markdown headers\n- Numbered lists for ordered steps, bullets for items\n- **Bold** key numbers, weights, and critical values\n- Be specific: exact numbers, volumes, timings — no vague language\n- Actionable and structured for direct implementation`;
  let user = `Create my personalized **${activeModule.title}** plan:\n\n`;
  Object.entries(inputs).forEach(([label, val]) => { user += `**${label}:** ${val || '*(not provided)*'}\n\n`; });
  user += `\nDeliver a thorough, specific, immediately actionable plan following the format requirements.`;
  streaming = true; accumulated = ''; setBtn(true);
  const outputSec = document.getElementById('outputSection');
  outputSec.classList.remove('hidden');
  document.getElementById('outputLabel').textContent = `${activeModule.icon} ${activeModule.title} — Plan`;
  setTimeout(() => outputSec.scrollIntoView({ behavior:'smooth', block:'start' }), 80);
  const out = document.getElementById('output');
  out.innerHTML = ''; out.classList.add('typing');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 2048, stream: true, system, messages: [{ role:'user', content:user }] })
    });
    if (!res.ok) { let msg = `HTTP ${res.status}`; try { msg = (await res.json()).error?.message ?? msg; } catch {} throw new Error(msg); }
    await streamResponse(res.body, out);
  } catch (err) {
    out.classList.remove('typing');
    out.innerHTML = `<p style="color:#f87171"><strong>Error:</strong> ${esc(err.message)}</p><p style="color:#555;font-size:.8rem;margin-top:.5rem">Check your API key and connection, then try again.</p>`;
  } finally { streaming = false; setBtn(false); out.classList.remove('typing'); }
}

async function streamResponse(body, el) {
  const reader = body.getReader(), dec = new TextDecoder(); let buf = '';
  while (true) {
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    const lines = buf.split('\n'); buf = lines.pop() ?? '';
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const raw = line.slice(6).trim(); if (raw === '[DONE]') continue;
      try {
        const ev = JSON.parse(raw);
        if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
          accumulated += ev.delta.text;
          el.innerHTML = marked.parse(accumulated);
          const bottom = document.body.scrollHeight - window.scrollY - window.innerHeight;
          if (bottom < 300) window.scrollTo({ top: document.body.scrollHeight });
        }
      } catch { }
    }
  }
  el.innerHTML = marked.parse(accumulated);
}

function setBtn(on) { const b = document.getElementById('genBtn'); b.disabled = on; b.textContent = on ? '⏳ Generating your plan...' : '⚡ Generate My Plan'; b.style.opacity = on ? '0.6' : '1'; }
function clearOutput() { accumulated = ''; document.getElementById('output').innerHTML = ''; document.getElementById('outputSection').classList.add('hidden'); }
function toggleKey() { const inp = document.getElementById('apiKey'), btn = document.getElementById('keyToggle'), hide = inp.type === 'password'; inp.type = hide ? 'text' : 'password'; btn.textContent = hide ? 'Hide' : 'Show'; }
function esc(s) { const d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }
</script>
</body>
</html>
