<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Day 3 — Adventures Await on Every Page</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #050d1a; }

  .canvas { width: 1080px; height: 1080px; position: relative; overflow: hidden; }

  .bg-layer {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 15% 30%, #00a8cc 0%, transparent 50%),
      radial-gradient(ellipse 50% 40% at 85% 25%, #9b27af 0%, transparent 50%),
      radial-gradient(ellipse 70% 60% at 50% 50%, #1a6b2a 0%, transparent 55%),
      radial-gradient(ellipse 60% 50% at 30% 70%, #d4760a 0%, transparent 50%),
      radial-gradient(ellipse 50% 40% at 70% 75%, #0a5a8b 0%, transparent 50%),
      radial-gradient(ellipse 40% 30% at 50% 10%, #f5c842 0%, transparent 45%),
      linear-gradient(160deg, #050d1a 0%, #0a2040 20%, #0d4020 40%, #1a3a05 60%, #2d0a40 80%, #050d1a 100%);
  }

  /* Magical floating particles */
  .particle {
    position: absolute; border-radius: 50%;
    background: rgba(255,240,100,0.7); filter: blur(1px);
    animation: float 4s ease-in-out infinite alternate;
  }
  .p1 { width: 6px; height: 6px; top: 20%; left: 15%; animation-delay: 0s; }
  .p2 { width: 4px; height: 4px; top: 35%; left: 80%; animation-delay: 0.5s; background: rgba(100,255,200,0.7); }
  .p3 { width: 8px; height: 8px; top: 10%; left: 55%; animation-delay: 1s; background: rgba(255,150,50,0.7); }
  .p4 { width: 5px; height: 5px; top: 60%; left: 10%; animation-delay: 1.5s; background: rgba(200,100,255,0.7); }
  .p5 { width: 6px; height: 6px; top: 25%; left: 40%; animation-delay: 0.8s; }
  .p6 { width: 4px; height: 4px; top: 45%; left: 90%; animation-delay: 2s; background: rgba(100,255,200,0.7); }
  .p7 { width: 7px; height: 7px; top: 70%; left: 75%; animation-delay: 0.3s; background: rgba(255,220,80,0.8); }

  @keyframes float {
    0% { transform: translateY(0) scale(1); opacity: 0.7; }
    100% { transform: translateY(-15px) scale(1.2); opacity: 1; }
  }

  .bokeh { position: absolute; border-radius: 50%; filter: blur(60px); }
  .b1 { width: 400px; height: 300px; top: -50px; left: -100px; background: rgba(0,168,204,0.2); }
  .b2 { width: 350px; height: 300px; top: 0; right: -80px; background: rgba(155,39,175,0.2); }
  .b3 { width: 500px; height: 300px; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(245,200,66,0.12); }
  .b4 { width: 300px; height: 300px; top: 200px; left: 50%; transform: translateX(-50%); background: rgba(26,107,42,0.2); }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 30%, rgba(5,13,26,0.8) 100%);
  }

  /* Energy arc decorative */
  .arc {
    position: absolute;
    border: 2px solid transparent;
    border-radius: 50%;
  }
  .arc-1 {
    width: 700px; height: 700px;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    border-top-color: rgba(0,200,255,0.15);
    border-right-color: rgba(255,200,0,0.1);
  }
  .arc-2 {
    width: 850px; height: 850px;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    border-bottom-color: rgba(155,39,175,0.12);
    border-left-color: rgba(100,255,100,0.08);
  }

  /* Portrait */
  .portrait-area {
    position: absolute;
    bottom: 200px; left: 50%; transform: translateX(-50%);
    width: 560px; height: 350px;
    border-radius: 20px; overflow: hidden;
    box-shadow:
      0 0 0 3px rgba(0,200,255,0.4),
      0 0 40px rgba(0,168,204,0.3),
      0 20px 80px rgba(0,0,0,0.7);
  }
  .portrait-placeholder {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #050d1a 0%, #0a2040 30%, #0d4020 60%, #1a1040 100%);
    display: flex; align-items: center; justify-content: center;
    color: rgba(0,220,255,0.4); font-family: 'Playfair Display', serif;
    font-size: 17px; text-align: center; padding: 20px; font-style: italic;
  }
  .portrait-shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(0,200,255,0.1) 0%, transparent 40%, rgba(155,39,175,0.15) 100%);
  }

  /* Content */
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; padding: 52px 60px;
  }

  .day-badge {
    background: linear-gradient(135deg, rgba(0,168,204,0.9), rgba(155,39,175,0.9));
    color: white;
    font-size: 12px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    padding: 8px 22px; border-radius: 50px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,168,204,0.4);
  }

  .headline {
    font-family: 'Fredoka One', cursive;
    font-size: 72px;
    color: #fff; text-align: center;
    line-height: 1;
    text-shadow:
      0 4px 30px rgba(0,0,0,0.9),
      0 0 40px rgba(0,200,255,0.3),
      3px 3px 0 rgba(0,100,150,0.5);
    letter-spacing: 1px;
  }
  .headline .pop {
    display: block;
    font-size: 88px;
    background: linear-gradient(135deg, #f5c842, #ff9030, #ff5050);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 4px 20px rgba(255,150,50,0.5));
  }

  .sub {
    font-family: 'Lato', sans-serif;
    font-size: 18px; font-weight: 300;
    color: rgba(200,240,255,0.85);
    letter-spacing: 4px; text-transform: uppercase;
    margin-top: 12px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  .bottom-content {
    position: absolute; bottom: 42px;
    left: 0; right: 0; text-align: center; padding: 0 80px;
  }
  .stars-deco { font-size: 22px; margin-bottom: 8px; letter-spacing: 8px; }
  .tagline {
    font-family: 'Playfair Display', serif; font-size: 19px; font-style: italic;
    color: rgba(200,240,255,0.85);
    margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  }
  .cta-line {
    font-family: 'Lato', sans-serif; font-size: 12px; font-weight: 300;
    color: rgba(0,220,255,0.65); letter-spacing: 2.5px; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-layer"></div>
  <div class="bokeh b1"></div>
  <div class="bokeh b2"></div>
  <div class="bokeh b3"></div>
  <div class="bokeh b4"></div>
  <div class="arc arc-1"></div>
  <div class="arc arc-2"></div>
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>
  <div class="particle p7"></div>
  <div class="vignette"></div>

  <div class="portrait-area">
    <div class="portrait-placeholder">[ Family portrait here ]<br><br>Impressionist style · magical adventure atmosphere</div>
    <div class="portrait-shimmer"></div>
  </div>

  <div class="content">
    <div class="day-badge">Day 3 of 5 · Adventure Awaits</div>
    <div class="headline">
      Adventures Await
      <span class="pop">Every Page!</span>
    </div>
    <div class="sub">Where Imagination Has No Limits</div>
  </div>

  <div class="bottom-content">
    <div class="stars-deco">✦ ✦ ✦</div>
    <p class="tagline">"Spark their curiosity — one page at a time."</p>
    <p class="cta-line">Beautifully illustrated · Ages 4–8 · Available now</p>
  </div>
</div>
</body>
</html>
