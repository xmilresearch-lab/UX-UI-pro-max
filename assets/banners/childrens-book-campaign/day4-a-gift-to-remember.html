<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Day 4 — A Gift They'll Remember Forever</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #12050a; }

  .canvas { width: 1080px; height: 1080px; position: relative; overflow: hidden; }

  .bg-layer {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 50% 40% at 70% 25%, #8b1a3a 0%, transparent 55%),
      radial-gradient(ellipse 60% 50% at 20% 40%, #5a1a00 0%, transparent 55%),
      radial-gradient(ellipse 40% 35% at 50% 15%, #d4a020 0%, transparent 50%),
      radial-gradient(ellipse 70% 60% at 50% 70%, #12050a 0%, transparent 65%),
      radial-gradient(ellipse 50% 40% at 80% 70%, #3d0a20 0%, transparent 50%),
      linear-gradient(175deg, #12050a 0%, #2d0a1a 20%, #5a1a00 40%, #8b4a00 60%, #c47020 75%, #e8c060 90%, #fff0c0 100%);
  }

  /* Gold sparkles */
  .sparkle {
    position: absolute;
    background: rgba(255,220,80,0.9);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: sparkle-anim 3s ease-in-out infinite;
  }
  .s1 { width: 20px; height: 20px; top: 12%; left: 12%; animation-delay: 0s; }
  .s2 { width: 14px; height: 14px; top: 18%; right: 15%; animation-delay: 0.7s; }
  .s3 { width: 18px; height: 18px; top: 8%; left: 55%; animation-delay: 1.4s; }
  .s4 { width: 12px; height: 12px; top: 30%; left: 8%; animation-delay: 0.4s; background: rgba(255,180,100,0.8); }
  .s5 { width: 16px; height: 16px; top: 25%; right: 8%; animation-delay: 1.1s; }
  .s6 { width: 10px; height: 10px; top: 35%; left: 40%; animation-delay: 2s; background: rgba(255,240,180,0.9); }

  @keyframes sparkle-anim {
    0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    50% { opacity: 1; transform: scale(1) rotate(180deg); }
    100% { opacity: 0; transform: scale(0.5) rotate(360deg); }
  }

  .bokeh { position: absolute; border-radius: 50%; filter: blur(50px); }
  .b1 { width: 400px; height: 400px; top: -100px; right: -100px; background: rgba(212,160,32,0.2); }
  .b2 { width: 300px; height: 300px; top: 100px; left: -80px; background: rgba(139,26,58,0.25); }
  .b3 { width: 500px; height: 200px; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(18,5,10,0.5); }
  .b4 { width: 250px; height: 250px; bottom: 280px; left: 80px; background: rgba(196,112,32,0.15); }

  /* Ribbon light effect */
  .ribbon-glow {
    position: absolute; top: 200px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 400px;
    background: linear-gradient(180deg, rgba(255,220,80,0) 0%, rgba(255,220,80,0.6) 30%, rgba(255,200,50,0.6) 70%, rgba(255,220,80,0) 100%);
    filter: blur(6px);
  }
  .ribbon-h {
    position: absolute; top: 350px; left: 50%; transform: translateX(-50%);
    width: 300px; height: 4px;
    background: linear-gradient(90deg, rgba(255,220,80,0) 0%, rgba(255,220,80,0.6) 30%, rgba(255,200,50,0.6) 70%, rgba(255,220,80,0) 100%);
    filter: blur(4px);
  }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 88% 88% at 50% 50%, transparent 35%, rgba(18,5,10,0.8) 100%);
  }

  /* Portrait */
  .portrait-area {
    position: absolute;
    bottom: 205px; left: 50%; transform: translateX(-50%);
    width: 560px; height: 340px;
    border-radius: 14px; overflow: hidden;
    box-shadow:
      0 0 0 2px rgba(255,200,80,0.4),
      0 0 50px rgba(212,160,32,0.35),
      0 20px 80px rgba(0,0,0,0.7);
  }
  .portrait-placeholder {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #12050a 0%, #2d0a1a 30%, #5a1a00 60%, #c47020 100%);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,200,80,0.4); font-family: 'Playfair Display', serif;
    font-size: 17px; text-align: center; padding: 20px; font-style: italic;
  }
  .portrait-shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,200,80,0.15) 0%, transparent 50%, rgba(139,26,58,0.2) 100%);
  }

  /* Content */
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; padding: 52px 80px;
  }

  .day-badge {
    background: linear-gradient(135deg, rgba(139,26,58,0.9), rgba(90,26,0,0.9));
    color: #f5c842;
    font-size: 12px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    padding: 8px 22px; border-radius: 50px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,200,80,0.35);
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-size: 68px; font-weight: 900;
    color: #fff8e8; text-align: center;
    line-height: 1;
    text-shadow: 0 4px 30px rgba(0,0,0,0.9), 0 0 60px rgba(212,160,32,0.3);
    letter-spacing: -1px;
  }
  .headline em {
    display: block; font-style: italic;
    font-size: 52px; font-weight: 700;
    color: #f5c842;
    margin-top: 6px;
  }
  .headline .accent {
    display: block; font-size: 84px;
    color: #fff;
    font-style: italic;
  }

  .sub {
    font-family: 'Lato', sans-serif;
    font-size: 17px; font-weight: 300;
    color: rgba(255,220,160,0.8);
    letter-spacing: 4px; text-transform: uppercase;
    margin-top: 14px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  .bottom-content {
    position: absolute; bottom: 44px;
    left: 0; right: 0; text-align: center; padding: 0 80px;
  }
  .gift-icons { font-size: 24px; margin-bottom: 8px; letter-spacing: 12px; opacity: 0.8; }
  .tagline {
    font-family: 'Playfair Display', serif; font-size: 20px; font-style: italic;
    color: rgba(255,230,160,0.85);
    margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  }
  .cta-line {
    font-family: 'Lato', sans-serif; font-size: 12px; font-weight: 300;
    color: rgba(255,200,80,0.65); letter-spacing: 2.5px; text-transform: uppercase;
  }

  .divider { display: flex; align-items: center; gap: 14px; margin: 10px auto; width: 280px; }
  .dl { flex: 1; height: 1px; background: rgba(212,160,32,0.4); }
  .ds { width: 7px; height: 7px; background: rgba(255,200,80,0.6); transform: rotate(45deg); }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg-layer"></div>
  <div class="bokeh b1"></div>
  <div class="bokeh b2"></div>
  <div class="bokeh b3"></div>
  <div class="bokeh b4"></div>
  <div class="sparkle s1"></div>
  <div class="sparkle s2"></div>
  <div class="sparkle s3"></div>
  <div class="sparkle s4"></div>
  <div class="sparkle s5"></div>
  <div class="sparkle s6"></div>
  <div class="ribbon-glow"></div>
  <div class="ribbon-h"></div>
  <div class="vignette"></div>

  <div class="portrait-area">
    <div class="portrait-placeholder">[ Family portrait here ]<br><br>Impressionist oil painting style<br>warm gift-giving atmosphere</div>
    <div class="portrait-shimmer"></div>
  </div>

  <div class="content">
    <div class="day-badge">Day 4 of 5 · The Perfect Gift</div>
    <div class="headline">
      <em>A Gift They'll</em>
      <span class="accent">Remember</span>
      Forever
    </div>
    <div class="sub">Give the Gift of Imagination</div>
  </div>

  <div class="bottom-content">
    <div class="gift-icons">🎁 ✨ 📖</div>
    <div class="divider"><div class="dl"></div><div class="ds"></div><div class="dl"></div></div>
    <p class="tagline">"The perfect present for every child who loves stories."</p>
    <p class="cta-line">Order now · Beautifully illustrated · Ages 4–8</p>
  </div>
</div>
</body>
</html>
